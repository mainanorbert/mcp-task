      - main [ref=e146]:
        - article [ref=e157]:
          - generic [ref=e169]:
            - paragraph [ref=e170]: The Projects in the Directorate of Irrigation are as follows under Community Irrigation Development Project.
            - paragraph [ref=e171]:
              - strong [ref=e172]: Kaigunji Irrigation Project
            - paragraph [ref=e173]: This project was initiated in 2016 after the community in Aguthi-Gaaki Ward in Tetu Sub County of Nyeri County requested to be assisted to establish the irrigation project. The First phase of the project involve construction of the headworks and a 26 km conveyance and mainline at a cost of KES. 156 Million.
            - paragraph [ref=e174]: Phase 2 which was started in 2018 involved the construction 600-acre distribution system in the Kaigonji block at a cost of KES. 100 Million. This was completed in early 2021 and the community is already using the irrigation water for various horticulture crop production.
            - paragraph [ref=e175]: Phase 3 was launched in April 2021 with a contract duration of one year. It involved construction of 1900 acres distribution system in Aguthi and Gaaki blocks at a cost of KES. 547 Million.
            - paragraph [ref=e176]:
              - strong [ref=e177]: Kanini Irrigation Project
            - paragraph [ref=e178]: This project commenced in April of 2021 and involve construction of the headworks, 2km conveyance pipeline, 5km main pipeline and distribution system in 100 acres at the cost of KES 34 Million. As at September 2021, the contract was 60% complete.
            - paragraph [ref=e179]:
              - strong [ref=e180]: Muranga Clusters
            - paragraph [ref=e181]: This involve construction of various irrigation project in Muranga County in various clusters. The targeted acreage is about 600 hectares at a total cost of KES. 218 Million. As at September 2021, the contract was 70% complete.
            - paragraph [ref=e182]:
              - strong [ref=e183]: Water for School
            - paragraph [ref=e184]: The Directorate also has a programme of Water for School Programme under the department of Land Reclamation. This financial 2021/2022, 11 school have been earmarked to benefit from the programme at a cost KES. 100 Million. The programme involve sinking of boreholes in school to provide water for school children and also set up micro irrigation schemes in greenhouses.
            - paragraph [ref=e185]:
              - strong [ref=e186]: Irrigation Water Management
            - paragraph [ref=e187]: There is also the department of Irrigation Water Management which mainly undertake issues like community mobilization and sensitization, policy development, department strategic development, Development of regulations and guidelines, scheme management and capacity building to the targeted community.
