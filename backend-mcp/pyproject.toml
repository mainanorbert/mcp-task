[project]
name = "backend-mcp"
version = "0.1.0"
description = "Simple chat API backed by OpenAI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.59.0",
    "pydantic-settings>=2.7.0",
    "fastapi-clerk-auth>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "schemas", "services"]
