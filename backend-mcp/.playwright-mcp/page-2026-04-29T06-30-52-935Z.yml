                - heading "State Department for Mining" [level=3] [ref=e200]
                - paragraph [ref=e202]:
                  - text: The State Department for Mining was created under the re-organization of the Government of the Republic of Kenya vide Executive Order No. 1 of January 2023 under the Ministry of Mining, Blue Economy and Maritime Affairs, previously it was under the Ministry of Petroleum and Mining. The State Department was established to provide leadership in the management of the extractives sector in the Country. The mandate includes development of mining and mining policies, Inventory and Mapping of mineral resources and building capacity for effective management of programmes and projects in the mining sector.
